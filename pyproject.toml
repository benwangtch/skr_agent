[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A deep research agent on LangChain deepagents, servable over A2A and runnable on a schedule"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.4",
    "langchain-anthropic>=1.5.3",
    "langchain-openai>=1.4.1",
    "pydantic-settings>=2.5",
    "a2a-sdk[http-server]==1.1.2", # pinned: 1.1.2 is the newest published 1.x; the API moves fast (see docs/design/DESIGN.md §7.1)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "croniter>=2.0",
    "langchain-mcp-adapters>=0.3.1",
    "mcp>=1.24,<2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Spawns a real MCP server subprocess (tests/mcp_fixture_server.py).
    # Still credential-free and offline; `-m "not mcp_server"` skips them.
    "mcp_server: exercises a live MCP server over stdio",
]
