[project]
name = "skr-agent"
version = "0.1.0"
description = "skr agent: a deep research agent on LangChain deepagents, servable over A2A and runnable on a schedule"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.4",
    "langchain-anthropic>=1.5.3",
    "langchain-openai>=1.4.1",
    "pydantic-settings>=2.5",
    "a2a-sdk[http-server]==0.3.26", # pinned: this package's API moves fast (see docs/design/01-config-and-serving.md §7)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "croniter>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
